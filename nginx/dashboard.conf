# Server block for your own nginx, proxying to the dashboard container.
# The stack publishes an HTTP port (HTTP_PORT in .env, default 8000).
#
#   sudo cp nginx/dashboard.conf /etc/nginx/conf.d/dashboard.conf
#   edit server_name and the proxy_pass port
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d dash.example.com     # optional TLS
#
# If nginx runs on the host and the port is published on the host, 127.0.0.1
# works. If nginx is itself in Docker, proxy to the service/host IP instead.

server {
    listen 80;
    listen [::]:80;
    server_name dash.example.com;

    # Optional login:
    #   sudo htpasswd -c /etc/nginx/.htpasswd you
    # auth_basic "Restricted";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
