<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stocky · Sign in</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='stock.svg') }}">
<meta name="theme-color" content="#252629">
<script>
  try {
    document.documentElement.dataset.theme = localStorage.getItem('stocky-theme') || 'dark';
  } catch { document.documentElement.dataset.theme = 'dark'; }
  // Text size (Options → Appearance) scales every font through --fs.
  try {
    const size = Number(JSON.parse(localStorage.getItem('stocky-prefs') || '{}').textSize);
    if (size > 0) document.documentElement.style.setProperty('--fs', size + 'px');
  } catch {}
</script>
<style>
  /* The app's font, bundled (static/fonts) so the page and the charts match
     on every machine. */
  @font-face { font-family:"Stocky Mono"; font-weight:400; font-display:swap;
               src:url("{{ url_for('static', filename='fonts/UbuntuMono-Regular.ttf') }}") format("truetype"); }
  @font-face { font-family:"Stocky Mono"; font-weight:700; font-display:swap;
               src:url("{{ url_for('static', filename='fonts/UbuntuMono-Bold.ttf') }}") format("truetype"); }
  :root {
    --fs:1px;               /* text size: Options → Appearance */
    color-scheme: dark;
    --mono:"Stocky Mono", "UbuntuMono Nerd Font Mono", "JetBrainsMono Nerd Font Mono", "FiraCode Nerd Font Mono",
           "Noto Sans Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace;
    --bg:#252629; --surface:#2c2d31; --bar:#1d1e21; --line:#3e4045; --line-soft:#323338;
    --muted:#cfd2d8; --text:#ffffff; --accent:#ffffff; --on-accent:#212226;
    --error:#ff9b9b; --error-bg:rgba(255,155,155,.14);
  }
  [data-theme="light"] {
    color-scheme: light;
    --bg:#f4f5f7; --surface:#ffffff; --bar:#e9eaed; --line:#d7d9de; --line-soft:#e7e8ec;
    --muted:#646770; --text:#1b1c1f; --accent:#26272a; --on-accent:#f7f8fa;
    --error:#b42318; --error-bg:rgba(180,35,24,.10);
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         padding:24px 16px; font:calc(var(--fs) * 17)/1.55 var(--mono); background:var(--bg); color:var(--text); }
  button, input { font-family:var(--mono); }
  .card { width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line);
          border-radius:12px; overflow:hidden; }
  .brand { display:flex; align-items:center; gap:10px; padding:18px 20px 6px; }
  .brand svg { width:32px; height:32px; color:var(--accent); }
  .brand h1 { margin:0; font-size:calc(var(--fs) * 22); }
  .switch { display:flex; gap:6px; padding:12px 20px 0; }
  .switch button { flex:1; padding:8px; border:1px solid var(--line); border-radius:8px; background:var(--bar);
                   color:var(--muted); font-size:calc(var(--fs) * 15); cursor:pointer; }
  .switch button.active { background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600; }
  form { padding:16px 20px 20px; }
  label { display:block; font-size:calc(var(--fs) * 14); color:var(--muted); margin:0 0 5px; }
  input { width:100%; margin:0 0 12px; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
          background:var(--bg); color:var(--text); font-size:calc(var(--fs) * 16); }
  input:focus { outline:none; border-color:var(--accent); }
  .primary { width:100%; margin-top:4px; padding:10px 12px; border:1px solid var(--accent); border-radius:8px;
             background:var(--accent); color:var(--on-accent); font-size:calc(var(--fs) * 16); font-weight:600; cursor:pointer; }
  .primary:disabled { opacity:.55; cursor:default; }
  .note { margin:12px 0 0; color:var(--muted); font-size:calc(var(--fs) * 14); }
  .msg { margin:0 0 12px; padding:8px 10px; border-radius:8px; background:var(--error-bg);
         color:var(--error); font-size:calc(var(--fs) * 15); }
  .msg:empty { display:none; }
  .hidden { display:none; }
</style>
</head>
<body>
<main class="card">
  <div class="brand">
    <svg viewBox="0 0 24 24" role="img" aria-label="Stocky">
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
        <path d="M3.5 13.5h4v4.5h-4zM10 9h4v5.5h-4zM16.5 4.5h4v5.5h-4z" fill="currentColor" opacity=".2" stroke="none" />
        <path d="M3.5 13.5h4v4.5h-4zM10 9h4v5.5h-4zM16.5 4.5h4v5.5h-4zM5.5 11v2.5M5.5 18v2.5M12 6.5V9M12 14.5V17M18.5 2v2.5M18.5 10v2.5" />
      </g>
    </svg>
    <h1>Stocky</h1>
  </div>
  <div class="switch" role="tablist">
    <button id="tab-in" class="active" role="tab" onclick="setMode('in')">Sign in</button>
    <button id="tab-up" role="tab" onclick="setMode('up')">Create account</button>
  </div>
  <form id="form" onsubmit="submitForm(event)">
    <p id="msg" class="msg" role="alert"></p>
    <div id="name-row" class="hidden">
      <label for="name">Name</label>
      <input id="name" autocomplete="name" maxlength="100">
    </div>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" maxlength="200" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" minlength="8" required>
    <button id="submit" class="primary" type="submit">Sign in</button>
    <p class="note" id="note">Accounts live only on this machine. Delete the app and they are gone.</p>
  </form>
</main>
<script>
const $ = s => document.querySelector(s);
let mode = 'in';

function setMode(next) {
  mode = next;
  const up = mode === 'up';
  $('#tab-in').classList.toggle('active', !up);
  $('#tab-up').classList.toggle('active', up);
  $('#name-row').classList.toggle('hidden', !up);
  $('#name').required = up;
  $('#password').autocomplete = up ? 'new-password' : 'current-password';
  $('#submit').textContent = up ? 'Create account' : 'Sign in';
  $('#note').textContent = up
    ? 'Your name and email are sent to the SEC as the contact for your requests, as it requires. Nothing leaves this machine otherwise.'
    : 'Accounts live only on this machine. Delete the app and they are gone.';
  $('#msg').textContent = '';
  (up ? $('#name') : $('#email')).focus();
}

async function submitForm(event) {
  event.preventDefault();
  const body = { email: $('#email').value.trim(), password: $('#password').value };
  if (mode === 'up') body.name = $('#name').value.trim();
  $('#submit').disabled = true;
  $('#msg').textContent = '';
  try {
    const res = await fetch(mode === 'up' ? '/api/signup' : '/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Something went wrong.');
    location.href = '/';
  } catch (err) {
    $('#msg').textContent = err.message;
    $('#submit').disabled = false;
  }
}

$('#email').focus();
</script>
</body>
</html>
