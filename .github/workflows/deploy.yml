name: Deploy to server

# Public repo: NEVER add pull_request or pull_request_target triggers here.
# Only code pushed/merged to main by a collaborator may run on the self-hosted
# runner. No third-party actions are used, so no external action can execute.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-stocky
  cancel-in-progress: false

jobs:
  deploy:
    name: Run stocky
    if: github.repository == 'jorgecanut/10kanalyzer' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, stocky]
    timeout-minutes: 30
    steps:
      - name: Deploy
        run: stocky
