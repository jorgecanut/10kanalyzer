# Runs the test suite on every push and pull request. No network needed:
# the tests use a fake pipeline instead of SEC/Yahoo.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # same as the Dockerfile
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover tests -v
