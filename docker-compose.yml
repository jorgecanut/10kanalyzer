# Single-service stack: publishes one HTTP port, which you front with your own
# nginx. Drop it into Dockge and deploy.
#
#   .env   -> EDGAR_IDENTITY (SEC contact) and optional HTTP_PORT
#   build  -> expects the Dockerfile/app next to this file (or set build.context)
services:
  dashboard:
    build: .
    image: edgar-dashboard
    restart: unless-stopped
    environment:
      EDGAR_IDENTITY: "${EDGAR_IDENTITY:-Data Analyst analyst@example.com}"
    ports:
      - "${HTTP_PORT:-8053}:8000"
    volumes:
      - /mnt/tanques/stocky/financial_graphs:/app/financial_graphs
      # Cache SEC downloads so repeat runs are fast.
      - /mnt/tanques/stocky/edgar_cache:/root/.edgar_cache
      - /mnt/tanques/stocky/edgar_data:/root/.edgar
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
