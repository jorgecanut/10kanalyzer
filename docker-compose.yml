# Single-service stack: publishes one HTTP port. Drop it into Dockge (or run
# `docker compose up -d --build`) and deploy.
#
#   .env   -> optional HTTP_PORT and host folders (see .env.example)
#   build  -> expects the Dockerfile/app next to this file (or set build.context)
#
# No SEC identity here: every user signs up in the app with a name and email,
# and that account is what is sent to the SEC.
services:
  dashboard:
    build:
      context: .
      args:
        # Optional: STOCKY_COMMIT=$(git rev-parse HEAD) docker compose up -d --build
        STOCKY_COMMIT: ${STOCKY_COMMIT:-}
    image: edgar-dashboard
    restart: unless-stopped
    environment:
      # edgartools writes to ~/.edgar / ~/.edgar_cache by default; set them
      # explicitly so the bind mounts below match regardless of HOME.
      EDGAR_LOCAL_DATA_DIR: /home/appuser/.edgar
      EDGAR_CACHE_DIR: /home/appuser/.edgar_cache
    ports:
      - "${HTTP_PORT:-8053}:8000"
    volumes:
      # Accounts, sessions and every user's results. The container runs as
      # appuser (uid 10001), so these host folders must be writable by it.
      - ${STOCKY_DATA:-./data}:/app/data
      # Cache SEC downloads so repeat runs are fast.
      - ${EDGAR_CACHE:-./edgar_cache}:/home/appuser/.edgar_cache
      - ${EDGAR_DATA:-./edgar_data}:/home/appuser/.edgar
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
