# Single-service stack: publishes one HTTP port, which you front with your own
# nginx. Drop it into Dockge and deploy.
#
#   .env   -> EDGAR_IDENTITY (SEC contact) and optional HTTP_PORT
#   build  -> expects the Dockerfile/app next to this file (or set build.context)
services:
  dashboard:
    build: .
    image: edgar-dashboard
    restart: unless-stopped
    environment:
      EDGAR_IDENTITY: "${EDGAR_IDENTITY:-Data Analyst analyst@example.com}"
    ports:
      # Host port comes from .env; change HTTP_PORT there, or hardcode this to
      # e.g. "8080:8000". The container always listens on 8000.
      - "${HTTP_PORT:-8000}:8000"
    volumes:
      - ./financial_graphs:/app/financial_graphs
      # Cache SEC downloads so repeat runs are fast.
      - edgar_cache:/root/.edgar_cache
      - edgar_data:/root/.edgar
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  edgar_cache:
  edgar_data:
