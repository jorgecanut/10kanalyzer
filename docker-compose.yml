# Single-service stack: publishes one HTTP port, which you front with your own
# nginx. Drop it into Dockge and deploy.
#
#   .env   -> EDGAR_IDENTITY (SEC contact) and optional HTTP_PORT
#   build  -> expects the Dockerfile/app next to this file (or set build.context)
services:
  dashboard:
    build: .
    image: edgar-dashboard
    restart: unless-stopped
    environment:
      EDGAR_IDENTITY: "${EDGAR_IDENTITY:-Data Analyst analyst@example.com}"
      # edgartools writes to ~/.edgar / ~/.edgar_cache by default; set them
      # explicitly so the bind mounts below match regardless of HOME.
      EDGAR_LOCAL_DATA_DIR: /home/appuser/.edgar
      EDGAR_CACHE_DIR: /home/appuser/.edgar_cache
    ports:
      - "${HTTP_PORT:-8053}:8000"
    volumes:
      - /mnt/tanques/stocky/financial_graphs:/app/financial_graphs
      # Cache SEC downloads so repeat runs are fast. The container runs as
      # appuser (uid 10001), so these must land in that user's home, not /root.
      - /mnt/tanques/stocky/edgar_cache:/home/appuser/.edgar_cache
      - /mnt/tanques/stocky/edgar_data:/home/appuser/.edgar
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
